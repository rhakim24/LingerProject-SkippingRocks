<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pen</title>
  </head>
  <body>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-v1.6.0.min.js"></script>
 
<a-scene
  cursor="rayOrigin: mouse"
  raycaster="objects: .clickable"
  vr-mode-ui="enabled: false"
  renderer="antialias: true"
  background="color: #d8dde0">
 
  <!-- lights -->
  <a-entity light="type: ambient; intensity: 0.7; color: #ffffff"></a-entity>
  <a-entity light="type: directional; intensity: 0.6" position="-1 3 1"></a-entity>
 
  <!-- camera, tilted down a bit toward the shore, no moving around -->
  <a-entity position="0 1.4 0" rotation="-20 0 0">
    <a-camera position="0 0 0" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
  </a-entity>
 
  <!-- water -->
  <a-plane rotation="-90 0 0" width="200" height="200" position="0 0 -100" color="#8fa6b0"></a-plane>
 
  <!-- sand -->
  <a-plane rotation="-90 0 0" width="200" height="5" position="0 0.01 -0.5" color="#e4dac6"></a-plane>
 
  <!-- a few pebbles on the sand, just for texture -->
  <a-sphere radius="1" scale="0.04 0.015 0.03" position="-0.9 0.02 -1.4" color="#8a8580"></a-sphere>
  <a-sphere radius="1" scale="0.03 0.012 0.025" position="1.1 0.02 -2.2" color="#9a948c"></a-sphere>
  <a-sphere radius="1" scale="0.05 0.015 0.035" position="-1.6 0.02 -2.5" color="#7d7873"></a-sphere>
  <a-sphere radius="1" scale="0.025 0.01 0.02" position="0.6 0.02 -1.2" color="#a29b92"></a-sphere>
  <a-sphere radius="1" scale="0.035 0.012 0.03" position="1.8 0.02 -1.6" color="#8a8580"></a-sphere>
 
  <!-- THE STONE (the JS panel makes it throwable) -->
  <a-entity id="stone" position="0 0.06 -1.8">
    <!-- invisible, bigger click area so the stone is easy to grab -->
    <a-sphere class="clickable" radius="0.35"
              material="opacity: 0; transparent: true; depthWrite: false"></a-sphere>
    <!-- the stone you see, gently rocking to invite a click -->
    <a-sphere radius="1" scale="0.16 0.05 0.12" color="#5f6366" roughness="0.9"
              animation="property: rotation; from: 0 0 -5; to: 0 0 5; dir: alternate; loop: true; dur: 1400; easing: easeInOutSine"></a-sphere>
  </a-entity>
</a-scene>
    <script src="./script.js"></script>
  </body>
</html>
